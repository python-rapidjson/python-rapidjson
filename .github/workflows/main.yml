name: Build, test and upload to PyPI

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

jobs:
  tests:
    name: All tests, on current Python
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
          pip install .

      - name: Tests
        run: |
          pytest tests

      - name: Doctests
        run: |
          make -C docs doctest -e PYTHON=$(which python3)

      - name: Typing stub tests
        run: |
          stubtest rapidjson

  debug-tests:
    name: Memory leak tests, on current debug build Python
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.14']

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: deadsnakes/action@v3.2.0
        with:
          python-version: ${{ matrix.python-version }}
          debug: true

      - name: Install dependencies
        run: |
          pip install -r requirements-test.txt
          pip install .

      - run: |
          pytest tests

  build_wheels:
    name: Build wheels on ${{matrix.arch}} for ${{ matrix.os }}
    needs: [ tests, debug-tests ]
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-26.04
          - macos-15
          - macos-15-intel
          - windows-2025
          - windows-11-arm
        arch:
          - auto
        include:
          - os: ubuntu-26.04
            arch: aarch64
          - os: ubuntu-26.04
            arch: ppc64le
          - os: ubuntu-26.04
            arch: riscv64

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: docker/setup-qemu-action@v4
        if:  ${{ matrix.arch == 'aarch64' || matrix.arch == 'ppc64le' || matrix.arch == 'riscv64' }}
        name: Set up QEMU

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_ARCHS_MACOS: ${{ matrix.arch }}
          CIBW_TEST_REQUIRES: "pytest pytest-benchmark pytz"
          CIBW_TEST_COMMAND: "pytest {project}/tests"
          CIBW_SKIP: "cp39*"
          # Skip tests on emulated hardware, take too long or not supported
          CIBW_TEST_SKIP: "*-*linux_{aarch64,ppc64le,riscv64} *-macosx_*:arm64"
          CIBW_ENABLE: cpython-prerelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wheels-for-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  upload_wheels:
    name: Upload wheels to PyPI
    needs: [ tests, debug-tests, build_wheels ]
    runs-on: ubuntu-latest

    # Upload to PyPI on every tag starting with 'v'
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: wheels-for-*
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
